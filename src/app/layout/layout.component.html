<div class="fixed top-0 left-0 w-full z-50">
    <app-header></app-header>
</div>

<div class="pt-[12vh] flex">
    <div class="w-[17%] fixed top-[12vh] bottom-0 left-0">
        <app-sidenav  (openModal)="openCreateModal()"></app-sidenav>
    </div>

    <div class="ml-[17%] w-[83%] h-[calc(100vh-12vh)] overflow-y-auto">
        <app-home></app-home>
    </div>
</div>


<div *ngIf="showCreateModal" class="fixed inset-0 bg-black bg-opacity-50 flex justify-center items-center z-[1001]">
    <div class="bg-white rounded-xl p-6 dark:bg-gray-800 w-[400px] h-fit z-[1099]">
      <form (ngSubmit)="submitCreate()" #createForm="ngForm" novalidate>
        <h2 class="text-xl font-bold mb-4">Create a New Task</h2>
      
        <div class="mb-4">
          <input
            type="text"
            class="border rounded w-full p-2"
            [(ngModel)]="newTask.title"
            #titleRef="ngModel"
            name="title"
            placeholder="Task Title"
            required
            minlength="3"
          />
          <div *ngIf="titleRef.invalid && titleRef.touched" class="text-red-500 text-sm mt-1">
            <div *ngIf="titleRef.errors?.['required']">Title is required</div>
            <div *ngIf="titleRef.errors?.['minlength']">Title must be at least 3 characters</div>
          </div>
        </div>
      
        <div class="mb-4">
          <textarea
            class="border rounded w-full p-2"
            [(ngModel)]="newTask.description"
            #descRef="ngModel"
            name="description"
            placeholder="Task Description"
            required
            minlength="5"
          ></textarea>
          <div *ngIf="descRef.invalid && descRef.touched" class="text-red-500 text-sm mt-1">
            <div *ngIf="descRef.errors?.['required']">Description is required</div>
            <div *ngIf="descRef.errors?.['minlength']">Minimum 5 characters required</div>
          </div>
        </div>
      
        <div class="mb-4">
          <input
            type="date"
            class="border rounded w-full p-2"
            [(ngModel)]="newTask.date"
            #dateRef="ngModel"
            name="date"
            required
          />
          <div *ngIf="dateRef.invalid && dateRef.touched" class="text-red-500 text-sm mt-1">
            <div *ngIf="dateRef.errors?.['required']">Date is required</div>
          </div>
        </div>
      
        <div class="mb-6">
          <select
            class="border rounded w-full p-2"
            [(ngModel)]="newTask.category"
            #categoryRef="ngModel"
            name="category"
            required
          >
            <option value="" disabled>Select Category</option>
            <option value="Personal">Personal</option>
            <option value="Study">Study</option>
            <option value="Work">Work</option>
            <option value="Home">Home</option>
          </select>
          <div *ngIf="categoryRef.invalid && categoryRef.touched" class="text-red-500 text-sm mt-1">
            <div *ngIf="categoryRef.errors?.['required']">Category is required</div>
          </div>
        </div>
      
        <div class="flex justify-between">
          <button
            (click)="closeModal()"
            type="button"
            class="bg-red-600 text-white px-4 py-2 rounded hover:bg-red-700"
          >
            Cancel
          </button>
          <button
            type="submit"
            [disabled]="createForm.invalid"
            class="bg-green-600 text-white px-4 py-2 rounded hover:bg-green-700 disabled:opacity-50 disabled:cursor-not-allowed"
          >
            Create
          </button>
        </div>
      </form>
    </div>
  </div>
