      <div class="outermost flex flex-col justify-between h-[calc(100vh-12vh)] border-r border-gray-300 dark:border-gray-600 dark:bg-gray-800">
        <div class="upper">
          <div class="tag-header p-4 border-b border-gray-300 dark:border-gray-600 text-xl text-center dark:text-white font-semibold">Categories</div>
          
          <div class="tags-selector" *ngFor="let category of categories">
            <div
              (click)="selectCategory(category) ; onCategoryClick(category)"
              class="tag flex justify-start p-3 border-b border-gray-300 dark:border-gray-600 px-4 text-md dark:text-white font-semibold dark:hover:bg-gray-600 cursor-pointer"
              [ngClass]="{'bg-blue-500 text-white': selectedCategory === category}"
            >
              <span>{{ category }}</span>
            </div>
          </div>
      
          <div class="add-btns flex justify-center">
            <div 
                (click)="triggerModal()"
                class="add-t-1 border-2 border-blue-600 bg-blue-600 m-2 w-full mt-4 p-2 text-lg text-center text-white font-semibold rounded-lg cursor-pointer">
                Add a Task
            </div>
          </div>
        </div>
      
        <div class="settings border-t border-gray-300 dark:border-gray-600">
          <div 
            (click)="logout()" 
            class="logout bg-red-600 rounded-lg m-2 p-1 text-center text-lg text-white font-semibold cursor-pointer">
            Logout
          </div>
        </div>
      </div>
