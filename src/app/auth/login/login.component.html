<div class="flex items-center justify-center min-h-screen bg-gray-100 dark:bg-gray-800">
    <div class="bg-white dark:bg-gray-700 rounded-lg shadow-lg p-8 w-full max-w-md">
      <h2 class="text-2xl font-bold mb-6 text-gray-800 dark:text-white text-center">Login</h2>
  
      <form (ngSubmit)="login()" #loginForm="ngForm">
        <div class="mb-4">
          <label class="block text-gray-700 dark:text-gray-300 mb-2" for="email">Username</label>
          <input 
            [(ngModel)]="username"
            id="username" 
            name="username"
            type="username" 
            class="w-full px-4 py-2 border border-gray-300 dark:border-gray-600 rounded focus:outline-none focus:ring-2 focus:ring-blue-500" 
            placeholder="Enter your Username" 
          />
        </div>
  
        <div class="mb-6">
          <label class="block text-gray-700 dark:text-gray-300 mb-2" for="password">Password</label>
          <input 
            [(ngModel)]="password"
            id="password" 
            name="password"
            type="password" 
            class="w-full px-4 py-2 border border-gray-300 dark:border-gray-600 rounded focus:outline-none focus:ring-2 focus:ring-blue-500" 
            placeholder="Enter your password" 
          />
        </div>
  
        <button 
          type="submit"
          class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-2 px-4 rounded transition duration-300"
        >
          Login
        </button>
      </form>
  
      <div class="mt-4 flex items-center justify-center text-center text-gray-600 dark:text-gray-300">
        Not a user? 
        <div routerLink="/signup" class="text-blue-500 cursor-pointer">Sign up</div>
      </div>
    </div>
  </div>
